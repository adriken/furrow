  ss.map(function(x){return'<tr><td><b>'+esc(x.label)+'</b></td><td>'+esc(x.crop)+'</td><td>'+esc(x.harvest_date||"")+'</td><td class="n">'+num(x.amount_paid).toLocaleString()+'</td><td class="n">'+num(x.amount_spent).toLocaleString()+'</td><td class="n">'+num(x.harvest_income).toLocaleString()+'</td><td class="n '+cl(x.net_profit)+'"><b>'+num(x.net_profit).toLocaleString()+'</b></td><td class="n">'+(x.roi_percent==null?"":Math.round(x.roi_percent)+"%")+'</td><td><button class="sm" data-act="ex" data-id="'+x.season_id+'">Expenses</button>'+(ro?'':' <button class="sm" data-act="es" data-id="'+x.season_id+'">Edit</button> <button class="sm" data-act="ds" data-id="'+x.season_id+'">Delete</button>')+'</td></tr>'}).join("")+'</tbody></table></div>';

  if(!ro)h+='<p><button class="pri" data-act="addseason">Add season</button> <button data-act="ef">Edit farm</button> <button data-act="df">Delete farm</button></p>';
  h+='</section>';
  if(S.form&&S.form.t=="season"&&!ro)h+=seasonForm(S.form.d);
  if(S.selSeason)h+=expPanel(D,ro)}
 return h}
function authView(){return'<div class="auth"><h1 style="font-size:40px">Furrow</h1><p class="mute">Every acre, every shilling, one honest ledger. Sign in to open your records.</p>'+
 '<div class="card"><form id="af"><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="6" autocomplete="current-password" required></label>'+
 '<div class="fa"><button class="pri" type="submit">Sign in</button><button type="button" data-act="signup">Create account</button></div></form>'+
 '<p class="mute" style="text-align:center;margin:14px 0 8px">or</p><button style="width:100%" data-act="google">Continue with Google</button><p class="msg '+(S.err?'err':'')+'" role="status">'+esc(S.msg)+'</p></div></div>'}
function appView(){var h='<header><b>Furrow</b><div><span class="cap">'+esc(S.user.email)+'</span> <button data-act="out">Sign out</button>'+(isSample()?'':' <button class="pri" data-act="addfarm">Add farm</button>')+'</div></header>';
 h+='<div class="hero"><h1>Every acre, every shilling, one honest ledger.</h1></div>';
 if(S.msg)h+='<p class="msg '+(S.err?'err':'')+'" role="status">'+esc(S.msg)+'</p>';
 if(!S.loaded)return h+'<p class="mute">Loading your records…</p>';
 if(isSample())return h+'<div class="banner"><span><b>Sample data.</b> This is an example ledger to show how Furrow works. It is not saved to your account and will not appear again once you start your own.</span><button data-act="start">Start my own ledger</button></div>'+view(DEMO,true);
 if(!S.farms.length&&!(S.form&&S.form.t=="farm"))h+='<section><h2>Start your ledger</h2><p class="mute">No farms yet. Add your first farm, then record each season with its income and expenses.</p><button class="pri" data-act="addfarm">Add farm</button></section>';
 return h+view({farms:S.farms,seasons:S.seasons},false)}
function render(){A.innerHTML=S.user?appView():authView()}
async function run(fn){S.err=false;try{await fn()}catch(e){S.err=true;var m=e.message||"Something went wrong.";S.msg=/failed to fetch|networkerror/i.test(m)?(location.protocol.indexOf("http")!==0||/claude|anthropic/.test(location.hostname)?"This page is running in a sandbox that blocks network access. Open it from http://localhost:3000 or your deployed site.":"Could not reach the database. Check your internet connection and try again."):m}render()}
// ---------- events ----------
document.addEventListener("submit",function(e){e.preventDefault();var fm=e.target,id=fm.getAttribute("id"),fd=Object.fromEntries(new FormData(fm));
 if(id=="af")return run(async function(){var r=await sb.auth.signInWithPassword({email:fd.email,password:fd.password});if(r.error)throw r.error});
 if(id=="ff")return run(async function(){var row={name:fd.name.trim(),owner_name:fd.owner_name.trim(),location:fd.location.trim(),area_chief:fd.area_chief.trim()||null,acres:+fd.acres},r;
  r=fd.rid?await sb.from("farms").update(row).eq("id",fd.rid).select():await sb.from("farms").insert(row).select();if(r.error)throw r.error;S.sel=r.data[0].id;S.form=null;S.msg="Farm saved.";await load()});
 if(id=="sf")return run(async function(){var row={label:fd.label.trim(),crop:fd.crop.trim()||null,harvest_date:fd.harvest_date||null,amount_paid:+fd.amount_paid,amount_spent:+fd.amount_spent,harvest_income:+fd.harvest_income},r;
  if(fd.rid)r=await sb.from("seasons").update(row).eq("id",fd.rid);else{row.farm_id=S.sel;r=await sb.from("seasons").insert(row)}if(r.error)throw r.error;S.form=null;S.msg="Season saved.";await load()});
 if(id=="xf")return run(async function(){var r=await sb.from("expenses").insert({season_id:S.selSeason,category:fd.category.trim(),description:fd.description.trim()||null,amount:+fd.amount,spent_on:fd.spent_on});if(r.error)throw r.error;S.msg="Expense added.";await load()})});
document.addEventListener("click",function(e){var b=e.target.closest("button[data-act]");if(!b)return;var a=b.dataset.act,id=b.dataset.id;
 if(a=="signup")return run(async function(){var x=document.querySelector("#af"),c={email:x.email.value,password:x.password.value};if(!c.email||c.password.length<6)throw new Error("Enter an email and a password of at least 6 characters.");var r=await sb.auth.signUp(c);if(r.error)throw r.error;S.msg=r.data.session?"":"Account created. Check your email to confirm it, then sign in."});
 if(a=="google")return run(async function(){var r=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin}});if(r.error)throw r.error});
 if(a=="out")return sb.auth.signOut();
 if(a=="start")return run(async function(){S.skip=true;S.sel=null;S.selSeason=null;S.msg="";await sb.auth.updateUser({data:{sample_seen:true}})});
 if(a=="sel"){S.sel=S.sel==id?null:id;S.selSeason=null;S.form=null;S.msg="";return render()}
 if(a=="addfarm"){S.form={t:"farm"};return render()}
 if(a=="ef"){S.form={t:"farm",d:S.farms.filter(function(x){return x.farm_id==S.sel}).map(function(x){return{id:x.farm_id,name:x.name,owner_name:x.owner_name,location:x.location,area_chief:x.area_chief,acres:x.acres}})[0]};return render()}
 if(a=="addseason"){S.form={t:"season"};return render()}
 if(a=="es"){S.form={t:"season",d:S.seasons.filter(function(x){return x.season_id==id})[0]};return render()}
 if(a=="cancel"){S.form=null;return render()}
 if(a=="ex")return run(async function(){S.selSeason=id;S.form=null;if(!isSample())await loadExp()});
 if(a=="closeexp"){S.selSeason=null;return render()}
 if(a=="sync")return run(async function(){var t=sum(S.exp,function(x){return x.amount}),r=await sb.from("seasons").update({amount_spent:t}).eq("id",S.selSeason);if(r.error)throw r.error;S.msg="Amount spent updated.";await load()});
 if(a=="dx"&&confirm("Delete this expense?"))return run(async function(){var r=await sb.from("expenses").delete().eq("id",id);if(r.error)throw r.error;S.msg="Expense deleted.";await load()});
 if(a=="ds"&&confirm("Delete this season and its expenses? This cannot be undone."))return run(async function(){var r=await sb.from("seasons").delete().eq("id",id);if(r.error)throw r.error;if(S.selSeason==id)S.selSeason=null;S.msg="Season deleted.";await load()});
 if(a=="df"&&confirm("Delete this farm and all its seasons? This cannot be undone."))return run(async function(){var r=await sb.from("farms").delete().eq("id",S.sel);if(r.error)throw r.error;S.sel=null;S.selSeason=null;S.msg="Farm deleted.";await load()})});
sb.auth.onAuthStateChange(function(ev,s){var prev=S.user&&S.user.id;S.user=s?s.user:null;
 if(!S.user){S.farms=[];S.seasons=[];S.exp=[];S.sel=null;S.selSeason=null;S.loaded=false;S.skip=false;return render()}
 if(S.user.id!==prev)setTimeout(load,0);else render()});
render();
</script></body></html>
